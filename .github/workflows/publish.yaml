name: Docker Image CI & publish to K8S

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: genarate image tag
      run: |
        echo "IMAGE_TAG=$(date +%s)" >> $GITHUB_ENV


    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: |
        docker build . --file Dockerfile --tag ghcr.io/sandorajsa/cicd-teszt-13a-acsop:$IMAGE_TAG
        docker login ghcr.io -u sandorajsa -p ${{ secrets.GHCR_TOKEN }}
        docker push ghcr.io/sandorajsa/ghactions-k8s-13a-acsop:$IMAGE_TAG
